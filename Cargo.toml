[package]
name = "pstfree"
version = "0.0.1"
edition = "2021"
description = "Read, export and repair Outlook PST/OST files on Windows. No Outlook, no licence, no fake progress bar."
repository = "https://github.com/sp00nznet/pstfree"
license = "MIT"
readme = "README.md"
keywords = ["pst", "ost", "outlook", "mapi", "forensics"]
categories = ["parser-implementations", "command-line-utilities"]

# One dependency, and only because Outlook 2013+ OST files zlib-compress their data
# blocks. Pure Rust and no build script, so the executable stays self-contained. Reading
# the format itself needs nothing - it is a published spec and bytes off a disk.
[dependencies]
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_UI_Controls_Dialogs"] }

[profile.release]
strip = true

[lib]
name = "pstfree"
path = "src/lib.rs"

[[bin]]
name = "pstfree"
path = "src/bin/pstfree.rs"

[[bin]]
name = "pstfree-gui"
path = "src/bin/pstfree-gui.rs"
